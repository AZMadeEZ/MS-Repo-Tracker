name: Validate Tracker

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests
          fi

      - name: Compile scripts
        run: |
          python -m py_compile github_api.py msft_docs_inventory.py msft_changes_last24h.py scripts/validate_tracker.py

      - name: Check CLI entry points
        run: |
          python msft_docs_inventory.py --help >/dev/null
          python msft_changes_last24h.py --help >/dev/null

      - name: Validate committed inventory and state
        run: |
          python scripts/validate_tracker.py

      - name: Run unit tests
        run: |
          python -m unittest discover -s tests
